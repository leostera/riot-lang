[package]
name = "tinyml"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
logos = "0.16"
miette = { version = "7", features = ["fancy"] }
once_cell = "1"
rt = { path = "../rt" }
thiserror = "2"
tokio = { version = "1", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp = "0.20"

[dev-dependencies]
criterion = "0.5"
insta = "1"

[[bench]]
name = "unifier"
harness = false
